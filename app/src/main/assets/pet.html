<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
}
#pet {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
}
</style>
</head>
<body>
<img id="pet" src="frames/pet_idle.svg" draggable="false">
<audio id="tapAudio" src="sound/tap.mp3" preload="auto"></audio>
<script>
var FRAMES = {
    idle: 'frames/pet_idle.svg',
    happy: 'frames/pet_happy.svg'
};
var img = document.getElementById('pet');
var busy = false;

function tapPet() {
    if (busy) return;
    busy = true;
    try { document.getElementById('tapAudio').play(); } catch(e) {}
    img.src = FRAMES.happy;
    setTimeout(function() {
        img.src = FRAMES.idle;
        busy = false;
    }, 1600);
}
</script>
</body>
</html>
