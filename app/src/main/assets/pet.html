<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
}
#pet {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
}
</style>
</head>
<body>
<img id="pet" src="frames/pet_idle.svg" draggable="false">
<script>
var FRAMES = {
    idle: 'frames/pet_idle.svg',
    blink: 'frames/pet_blink.svg',
    happy: 'frames/pet_happy.svg',
    wry: 'frames/pet_wry.svg',
    breathe: 'frames/pet_breathe.svg'
};
var img = document.getElementById('pet');
var baseMode = 'idle';

function show(name) {
    img.src = FRAMES[name];
}

// 基础循环：idle -> 偶尔blink -> 偶尔breathe
function schedule() {
    var delay = 1500 + Math.random() * 2000;
    setTimeout(function() {
        if (baseMode !== 'idle') return;
        var r = Math.random();
        if (r < 0.6) {
            // 眨眼
            show('blink');
            setTimeout(function() {
                if (baseMode === 'idle') show('idle');
                schedule();
            }, 260);
        } else if (r < 0.8) {
            // 呼吸
            show('breathe');
            setTimeout(function() {
                if (baseMode === 'idle') show('idle');
                schedule();
            }, 600);
        } else {
            schedule();
        }
    }, delay);
}
schedule();

// 点击：随机给个表情，然后回到idle
function tapPet() {
    if (baseMode !== 'idle') return;
    baseMode = 'paused';
    var seq = ['happy', 'wry', 'happy', 'blink', 'breathe'];
    var pick = seq[Math.floor(Math.random() * seq.length)];
    show(pick);
    setTimeout(function() {
        baseMode = 'idle';
        show('idle');
        schedule();
    }, 1600);
}
</script>
</body>
</html>
